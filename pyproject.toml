[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dialect-norm"
version = "0.1.0"
description = "Indic Speech Recognition & Dialect Evaluation Suite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "datasets",
    "evaluate",
    "jiwer",
    "librosa",
    "onnxruntime>=1.28.0",
    "pyyaml",
    "soundfile",
    "torch",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers",
]

[project.scripts]
dialect-norm = "dialect_norm.cli:main"
dialect-pipeline = "dialect_norm.cli:main"
dialect-eval = "dialect_norm.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
