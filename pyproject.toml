[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dialect-norm"
version = "0.1.0"
description = "Indic Speech Recognition & Dialect Evaluation Suite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "datasets",
    "evaluate",
    "jiwer",
    "librosa",
    "numpy",
    "onnxruntime>=1.28.0",
    "openai",
    "protobuf",
    "pyyaml",
    "sacrebleu",
    "sentencepiece",
    "soundfile",
    "torch",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers",
]

[project.scripts]
dialect-norm = "dialect_norm.cli:main"
dialect-pipeline = "dialect_norm.cli:main"
dialect-eval = "dialect_norm.cli:main"

extract-dataset = "dialect_norm.data_processing.extract_dataset:main"
generate-stats = "dialect_norm.data_processing.generate_stats:main"
split-clean-dataset = "dialect_norm.data_processing.split_and_clean:main"
filter-flawed = "dialect_norm.data_processing.filter_flawed:main"
verify-dataset-llm = "dialect_norm.data_processing.llm_verifier:main"
correct-flawed = "dialect_norm.data_processing.correct_flawed:main"
merge-corrected = "dialect_norm.data_processing.merge_corrected:main"
augment-dataset = "dialect_norm.data_processing.augment_dataset:main"

train-indicbart-d1 = "dialect_norm.training.indicbart_trainer:cli_train_d1"
train-indicbart-d2 = "dialect_norm.training.indicbart_trainer:cli_train_d2"
train-indicbart-d4 = "dialect_norm.training.indicbart_trainer:cli_train_d4"
train-indicbart-d1d2 = "dialect_norm.training.indicbart_trainer:cli_train_d1d2"
train-indicbart-all = "dialect_norm.training.indicbart_trainer:cli_train_all"
train-indicbart-d1-32k = "dialect_norm.training.indicbart_trainer:cli_train_d1_32k"
train-indicbart-d2-32k = "dialect_norm.training.indicbart_trainer:cli_train_d2_32k"
train-indicbart-d4-32k = "dialect_norm.training.indicbart_trainer:cli_train_d4_32k"
train-indicbart-all-32k = "dialect_norm.training.indicbart_trainer:cli_train_all_32k"
train-indicbart-raw-unverified = "dialect_norm.training.indicbart_trainer:cli_train_raw_unverified_32k"

train-mt5-d1-16k = "dialect_norm.training.mt5_trainer:train_mt5_d1_16k"
train-mt5-d2-16k = "dialect_norm.training.mt5_trainer:train_mt5_d2_16k"
train-mt5-d4-16k = "dialect_norm.training.mt5_trainer:train_mt5_d4_16k"
train-mt5-all-16k = "dialect_norm.training.mt5_trainer:train_mt5_all_16k"
train-mt5-d1-32k = "dialect_norm.training.mt5_trainer:train_mt5_d1_32k"
train-mt5-d2-32k = "dialect_norm.training.mt5_trainer:train_mt5_d2_32k"
train-mt5-d4-32k = "dialect_norm.training.mt5_trainer:train_mt5_d4_32k"
train-mt5-all-32k = "dialect_norm.training.mt5_trainer:train_mt5_all_32k"
train-mt5-raw-unverified = "dialect_norm.training.mt5_trainer:train_mt5_raw_unverified_32k"
run-unverified-ablation = "dialect_norm.training.run_unverified_ablation_experiment:main"


train-indictrans2-d1-16k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_d1_16k"
train-indictrans2-d2-16k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_d2_16k"
train-indictrans2-d4-16k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_d4_16k"
train-indictrans2-all-16k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_all_16k"
train-indictrans2-d1-32k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_d1_32k"
train-indictrans2-d2-32k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_d2_32k"
train-indictrans2-d4-32k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_d4_32k"
train-indictrans2-all-32k = "dialect_norm.training.indictrans2_trainer:train_indictrans2_all_32k"



[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
