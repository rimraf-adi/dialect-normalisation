[project]
name = "dialect-norm"
version = "0.1.0"
description = "IndicWhisper RESPIN Hindi Evaluation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "datasets",
    "evaluate",
    "jiwer",
    "librosa",
    "pyyaml",
    "soundfile",
    "torch",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
